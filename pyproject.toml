[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-voice-engine"
version = "0.2.0"
description = "Forkable provider-agnostic realtime conversational voice runtime."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.12"]
gemini = ["google-genai>=1.2.0"]
deepgram = ["requests>=2.31"]
whisper = ["faster-whisper>=1.0", "numpy>=1.26"]
openai_completions = ["httpx>=0.27"]
webrtc = ["aiortc>=1.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
voice-engine = "voice_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
